<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusHub — Login</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:radial-gradient(circle at 20% 20%, #1e4976 0%, #091929 70%); }

    .login-wrap { width:420px; max-width:96vw; }

    .login-logo { text-align:center; margin-bottom:26px; }
    .login-logo .logo-icon { font-size:2.8rem; }
    .login-logo h1 { font-family:var(--font-serif); color:#fff; font-size:1.85rem; font-weight:700; margin:6px 0 4px; letter-spacing:-0.02em; }
    .login-logo p  { color:rgba(255,255,255,.65); font-size:.84rem; letter-spacing:0.03em; }

    .login-card {
      background:#fff;
      border-radius:12px;
      padding:32px 34px 26px;
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 24px 64px rgba(0,0,0,.35);
    }

    .login-card h2 { font-family:var(--font-serif); font-size:1.3rem; font-weight:700; color:var(--primary); margin-bottom:4px; }
    .login-card p.subtitle { font-size:.83rem; color:var(--text-muted); margin-bottom:22px; }

    .role-pills {
      display:flex;
      gap:8px;
      margin-bottom:24px;
    }
    .role-pill {
      flex:1;
      padding:9px 4px;
      border-radius:9px;
      border:2px solid var(--border);
      background:#fafbfc;
      cursor:pointer;
      text-align:center;
      font-size:.8rem;
      font-weight:600;
      color:var(--text-muted);
      transition:all .2s;
    }
    .role-pill:hover { border-color:var(--primary); color:var(--primary); }
    .role-pill.selected { border-color:var(--primary); background:var(--primary); color:#fff; }
    .role-pill .pill-icon { font-size:1.3rem; display:block; margin-bottom:4px; }

    #login-error {
      display:none;
      background:#fff0f0;
      border:1px solid #ffcdd2;
      border-radius:8px;
      padding:10px 14px;
      font-size:.85rem;
      color:#c62828;
      margin-bottom:16px;
    }

    .btn-login {
      width:100%;
      padding:12px;
      font-size:.95rem;
      border-radius:9px;
      margin-top:8px;
    }

    .login-footer { text-align:center; margin-top:20px; font-size:.78rem; color:rgba(255,255,255,.45); }

    .demo-hint {
      margin-top:20px;
      padding:12px 14px;
      background:#f0f4f8;
      border-radius:9px;
      font-size:.78rem;
      color:var(--text-muted);
    }
    .demo-hint strong { color:var(--primary); }
  </style>
</head>
<body>
<div id="toast-container"></div>

<div class="login-wrap">
  <div class="login-logo">
    <div class="logo-icon">🏛️</div>
    <h1>CampusHub</h1>
    <p>University Student &amp; Course Management System</p>
  </div>

  <div class="login-card">
    <h2>Welcome back!</h2>
    <p class="subtitle">Sign in to your portal</p>

    <div class="role-pills">
      <div class="role-pill" data-role="admin">
        <span class="pill-icon">🛡️</span>Admin
      </div>
      <div class="role-pill" data-role="student">
        <span class="pill-icon">👩‍🎓</span>Student
      </div>
      <div class="role-pill" data-role="faculty">
        <span class="pill-icon">👨‍🏫</span>Faculty
      </div>
    </div>

    <div id="login-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="l-username" class="form-control" placeholder="Enter your username" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="l-password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-login" id="btn-login">🔐 Sign In</button>
    </form>

    <div class="demo-hint">
      <strong>First time?</strong> Ask your administrator to create your account, then use those credentials to sign in.
    </div>
  </div>

  <div class="login-footer">CampusHub v1.0 · Powered by Flask &amp; MySQL</div>
</div>

<script>
  // Role pill selection (visual only — the server validates role from the DB)
  document.querySelectorAll('.role-pill').forEach(p =>
    p.addEventListener('click', () => {
      document.querySelectorAll('.role-pill').forEach(x => x.classList.remove('selected'));
      p.classList.add('selected');
      document.getElementById('l-username').placeholder = `${p.dataset.role} username`;
    })
  );

  const errBox = document.getElementById('login-error');

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    errBox.style.display = 'none';
    const btn = document.getElementById('btn-login');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const username = document.getElementById('l-username').value.trim();
    const password = document.getElementById('l-password').value.trim();

    try {
      const res  = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const json = await res.json();

      if (json.success) {
        window.location.href = json.data.redirect;
      } else {
        errBox.textContent  = json.message;
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '🔐 Sign In';
      }
    } catch (_) {
      errBox.textContent  = 'Connection error. Is the server running?';
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '🔐 Sign In';
    }
  });
</script>
</body>
</html>
